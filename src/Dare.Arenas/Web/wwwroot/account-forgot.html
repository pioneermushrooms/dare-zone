<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — SubSpace Foundation</title>
<link rel="stylesheet" href="/account/style.css">
<script src="/account/account.js" defer></script>
</head>
<body data-page="forgot">
<header class="site"><nav aria-label="Main navigation"><a class="brand" href="/"><span class="logo" aria-hidden="true">◈</span> SUBSPACE FOUNDATION</a><div class="navlinks"><a href="/">Play</a><a href="/build.html">Create an arena</a><a href="/arenas.html">Arena directory</a></div><a class="outline" href="/account/">Pilot account</a></nav></header>
<main class="panel narrow">
  <h2>Forgot password</h2>
  <p class="dim">We email a code to your recovery email.</p>
  <form method="post" class="stack" id="form">
    <label>Recovery email <input name="email" type="email" maxlength="254" autocomplete="email" required></label>
    <button type="submit">Send code</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="links"><a href="/account/login">Sign in</a></p>
</main>
</body>
</html>
