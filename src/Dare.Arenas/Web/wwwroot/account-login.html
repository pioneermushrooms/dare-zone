<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — SubSpace Foundation</title>
<link rel="stylesheet" href="/account/style.css">
<script src="/account/account.js" defer></script>
</head>
<body data-page="login">
<header class="site"><nav aria-label="Main navigation"><a class="brand" href="/"><span class="logo" aria-hidden="true">◈</span> SUBSPACE FOUNDATION</a><div class="navlinks"><a href="/play/">Play</a><a href="/build.html">Create an arena</a><a href="/arenas.html">Arena directory</a></div><a class="outline" href="/account/">Pilot account</a></nav></header>
<main class="panel narrow">
  <h2>Sign in</h2>
  <form method="post" class="stack" id="form">
    <label>Name <input name="name" maxlength="23" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" maxlength="31" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="links"><a href="/account/forgot">Forgot password?</a> · <a href="/account/signup">Claim a name</a></p>
</main>
</body>
</html>
