<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account · SubSpace Foundation</title>
<link rel="stylesheet" href="/account/style.css">
<script src="/account/account.js" defer></script>
</head>
<body data-page="profile">
<header class="top">
  <h1>FOUNDATION</h1>
  <span class="sub">ACCOUNT</span>
  <nav><a href="/arena/">Arenas</a></nav>
</header>
<main class="panel narrow" id="loading"><p class="dim">Loading…</p></main>

<main class="panel narrow" id="profile" hidden>
  <h2>Your account</h2>
  <dl class="facts">
    <dt>Name</dt><dd id="name"></dd>
    <dt>Recovery email</dt><dd id="email"></dd>
    <dt>Linked ISOJ name</dt><dd id="isoj"></dd>
  </dl>
  <p class="links"><a href="/arena/me">Your arena</a> · <button type="button" class="small" id="signout">Sign out</button></p>
</main>

<main class="panel narrow" id="emailbox" hidden>
  <h2 id="emailtitle">Recovery email</h2>
  <p class="dim" id="emailnote"></p>
  <form method="post" class="stack" id="emailform">
    <label>New recovery email <input name="email" type="email" maxlength="254" autocomplete="email" required></label>
    <button type="submit">Send code</button>
  </form>
  <form method="post" class="stack" id="codeform" hidden>
    <label>Code <input name="code" class="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
    <button type="submit">Confirm email</button>
  </form>
  <p class="msg" id="emailmsg"></p>
</main>

<main class="panel narrow" id="pwbox" hidden>
  <h2>Change password</h2>
  <form method="post" class="stack" id="pwform">
    <label>Current password <input name="current" type="password" maxlength="31" autocomplete="current-password" required></label>
    <label>New password <input name="next" type="password" minlength="8" maxlength="31" autocomplete="new-password" required>
      <span class="hint">8–31 characters. Use it in the game too.</span></label>
    <button type="submit">Change password</button>
  </form>
  <p class="msg" id="pwmsg"></p>
</main>
</body>
</html>
