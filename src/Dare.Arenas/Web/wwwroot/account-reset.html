<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New password — SubSpace Foundation</title>
<link rel="stylesheet" href="/account/style.css">
<link rel="stylesheet" href="/account/header.css">
<script src="/account/account.js" defer></script>
</head>
<body data-page="reset">
<header class="bar"><a class="brand" href="/" aria-label="SubSpace Foundation home"><span class="logo" aria-hidden="true">◈</span><span class="word">SubSpace <em>Foundation</em></span></a>
  <nav class="toplinks" aria-label="Site"><a href="/" title="The home page: pick an arena, chat, and fly">Home</a><a href="/foundry.html" title="The Foundry: ships and graphics pilots designed, for everyone">Foundry</a><a href="/arena/me#overview" title="Make an arena; draw its map, set its rules, graphics and crew">Arena Editor</a></nav></header>
<script src="/account/header.js"></script>
<main class="panel narrow">
  <h2>Set a new password</h2>
  <p class="dim" id="sent">Enter the code we emailed you (valid 10 minutes).</p>
  <form method="post" class="stack" id="form">
    <label>Recovery email <input name="email" type="email" maxlength="254" autocomplete="email" required></label>
    <label>Pilot name <input name="name" maxlength="20" autocomplete="username">
      <span class="hint">Only needed when this email has more than one pilot; the email lists them.</span></label>
    <label>Code <input name="code" class="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
    <label>New password <input name="password" type="password" minlength="8" maxlength="31" autocomplete="new-password" required>
      <span class="hint">8–31 characters.</span></label>
    <button type="submit">Set password</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="links"><a href="/account/forgot">Send a new code</a> · <a href="/account/login">Sign in</a></p>
</main>
</body>
</html>
