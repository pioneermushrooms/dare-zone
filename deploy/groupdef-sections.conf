; ---- Dare.Arenas: player-owned arenas (granted arena-scoped by the module) ----
; Not based on groupdef.dir/mod: arenacaps holds only arena-limited capabilities.
; [arenabot] comes first: apply-local.sh recognises an old block by [arenamod] being last.
[arenabot]
#include groupdef.dir/default
#include groupdef.dir/arenabot

[arenaowner]
#include groupdef.dir/default
#include groupdef.dir/arenacaps
#include groupdef.dir/arenaowner

[arenamod]
#include groupdef.dir/default
#include groupdef.dir/arenacaps
#include groupdef.dir/arenamod
; ---- end Dare.Arenas ----
