; Template for player-owned arenas (Dare.Arenas). Approval copies this folder to arenas/<name>/.
; Owners change settings with ?arenaset <Section:Key> <value> (or the web page)
; and the map/graphics with ?arenamap / ?putlvz (or the web page).

; Start with the shared, standard settings as a baseline.
#include conf/svs/svs.conf

[ General ]
Map = smallmape.lvl

; Voice menu (Dare client: V then letters; ?v <code>). Defaults shown.
;[ Voice ]
;Enabled = 1
;Burst = 3
;Window = 6
;Silence = 10

; Scoring and rules this arena runs (the game mode editor sets this): Kills, Flags, Balls, King, Ships, ShipChange.
[ GameMode ]
Attach = Kills
