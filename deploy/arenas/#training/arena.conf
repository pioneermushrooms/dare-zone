; The tutorial arena: #training1, #training2, ... (one per player) all use this folder.
; Module-owned: deploy/apply-local.sh copies it over the zone's copy on every deploy.
; training.lvl and tutorial.lvz are generated by tools/tutorial-lvz/build.js from
; src/Dare.Arenas/tutorial/script.json; the coordinates below are the map's spots
; (tools/tutorial-lvz/map.js SPOTS; tests/js/tutorial-lvz.test.js checks they agree).

#include conf/svs/svs.conf

[General]
Map = training.lvl
LevelFiles = tutorial.lvz

; The pilot can't really die in the swarm skit.
[Warbird]
InitialEnergy = 3000
MaximumEnergy = 3000
UpgradeEnergy = 0

; The swarm and the target (Javelins) go down in a few hits.
[Javelin]
InitialEnergy = 150
MaximumEnergy = 150
UpgradeEnergy = 0
InitialRecharge = 100
MaximumRecharge = 100

; Weak bullets that still do damage, so the swarm takes a while by hand.
[Bullet]
BulletDamageLevel = 30
BulletDamageUpgrade = 30

[Prize]
; engines stay off until the zone ends the skit (the longest value; the zone gives the shutdown)
EngineShutdownTime = 32767
; greens for the green field: Continuum scatters them this many tiles round the map centre
MinimumVirtual = 16
UpgradeVirtual = 0
PrizeFactor = 10000
PrizeHideCount = 20
PrizeDelay = 100
PrizeNegativeFactor = 32000

; no greens that throw the pilot across the map
[PrizeWeight]
Warp = 0
Portal = 0

[Spawn]
; the pilot (freq 0) at the start; the target and swarm (freq 1) in the ring
Team0-X = 450
Team0-Y = 562
Team0-Radius = 2
Team1-X = 460
Team1-Y = 462
Team1-Radius = 8

; One flag to pick up.
[Flag]
CarryFlags = 1
FlagCount = 1
SpawnX = 570
SpawnY = 522
SpawnRadius = 1
FlagDropDelay = 1500
FlagReward = 0

; One ball and an open goal.
[Soccer]
BallCount = 1
Mode = 0
SpawnX = 560
SpawnY = 585
SpawnRadius = 1
BallLocation = 1

; Freq 0 for the pilot (and the teammate bot), freq 1 for the bots they fight; no private freqs.
[Team]
MaxFrequency = 2
DesiredTeams = 1
ForceEvenTeams = 0
InitialSpec = 0
PrivFreqStart = 100
MaxPerPrivateTeam = 0

; Nothing scored here counts: no kill or periodic points.
[Kill]
FixedKillReward = 0
BountyIncreaseForKill = 0

[Periodic]
RewardPoints = 0
