<polygon points="37,53 48,57 59,53 57,63 48,66 39,63" fill="#3a2500"/>
<line x1="44" y1="59" x2="44" y2="63" stroke="#c98a00" stroke-width="1"/>
<line x1="48" y1="60" x2="48" y2="64" stroke="#c98a00" stroke-width="1"/>
<line x1="52" y1="59" x2="52" y2="63" stroke="#c98a00" stroke-width="1"/>
<polyline points="32,60 42,67 54,67 64,60" fill="none" stroke="#ffe28a" stroke-width="1" opacity=".8"/>
</svg>
